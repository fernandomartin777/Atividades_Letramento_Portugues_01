<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Conte as Estrelas</title>
  <style>
    /* RESET E FUNDO AZUL NOTURNO */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Georgia, 'Times New Roman', serif;
    }

/* AJUSTE RESPONSIVO PARA TELAS DE CELULAR */
html {
  height: 100%;
}

body {
  background-color: #ffffff; /* ou a cor do seu tema */
  color: #4a3e56;
  /* 100dvh se adapta perfeitamente com ou sem barras do navegador */
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 15px;
  /* Margem de segurança inferior para iPhones e Androids */
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  overflow: hidden;
  user-select: none;
}
    /* CABEÇALHO PERMANENTE */
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    .titulo-pagina {
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: bold;
      color: #e6f2ff;
      text-shadow: 0 0 8px rgba(230, 242, 255, 0.3);
    }

    .btn-fechar {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2c5282; /* Azul discreto que não confunde com estrela */
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
      line-height: 1;
    }

    .btn-fechar:hover {
      color: #4299e1;
    }

    /* CONTAINER PRINCIPAL */
    .container-jogo {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      margin-top: 10px;
      min-height: 0; /* Permite encolhimento correto no flexbox */
    }

    /* TELA DE CONFIGURAÇÃO INICIAL */
    .painel-configuracao {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: auto;
      margin-bottom: auto;
      background: rgba(255, 255, 255, 0.04);
      padding: 35px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .linha-inputs {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .campo-config {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-numero {
      width: 80px;
      padding: 8px;
      font-size: 1.2rem;
      text-align: center;
      border: 1px solid #2b6cb0;
      border-radius: 6px;
      background: #142642;
      color: #ffffff;
    }

    .linha-botoes-modo {
      display: flex;
      gap: 15px;
    }

    .btn-modo {
      padding: 10px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      background-color: #1e3a8a;
      color: #e0e6ed;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-modo:hover {
      background-color: #2563eb;
    }

    /* CAMPO DE ESTRELAS RESPONSIVO (OCUPA O ESPAÇO DISPONÍVEL) */
    .campo-ceu {
      width: 100%;
      flex: 1; /* Ocupa dinamicamente a altura máxima da tela */
      min-height: 50vh;
      position: relative;
      margin: 10px 0;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: none; /* Exibido apenas no jogo */
      overflow: hidden;
    }

    /* ESTRELAS */
    .estrela {
      position: absolute;
      width: 24px;
      height: 24px;
      color: #d4e6ff; /* Tom claro e azulado natural */
      text-shadow: 0 0 6px #a3c8ff;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
    }

    /* ÁREA DE RESPOSTA (INFERIOR) */
    .painel-resposta {
      display: none;
      align-items: center;
      gap: 12px;
      margin: 5px 0 5px 0;
      flex-shrink: 0; /* Impede que o campo de resposta seja empurrado para fora */
      z-index: 20;
    }

    .input-resposta {
      width: 120px;
      height: 55px;
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      border: 2px solid #2b6cb0;
      border-radius: 8px;
      background-color: #142642;
      color: #ffffff;
      outline: none;
      transition: background-color 0.3s;
    }

    .input-erro {
      background-color: #63171b !important; /* Vermelho claro/suave */
      border-color: #e53e3e !important;
    }

    .btn-continuar {
      width: 55px;
      height: 55px;
      font-size: 1.6rem;
      background-color: #1e3a8a;
      color: #e0e6ed;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .btn-continuar:hover {
      background-color: #2563eb;
    }

    /* TELA DE CONGRATULAÇÕES */
    .painel-congratulacoes {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: auto;
      margin-bottom: auto;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid #2b6cb0;
    }

    .mensagem-vitoria {
      font-size: 1.4rem;
      line-height: 1.6;
      color: #e6f2ff;
    }

    /* ESCONDER ELEMENTOS NATIVOS DE INPUT NUMBER */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO PERMANENTE -->
  <header>
    <div class="titulo-pagina">Conte as estrelas</div>
    <a href="https://fernandomartin777.github.io/Atividades_Letramento_Portugues_01/" class="btn-fechar" title="Sair da atividade">✕</a>
  </header>

  <div class="container-jogo">
    
    <!-- TELA 1: CONFIGURAÇÃO INICIAL -->
    <div id="painel-configuracao" class="painel-configuracao">
      <div class="linha-inputs">
        <div class="campo-config">
          <label for="input-minimo">Mínimo:</label>
          <input type="number" id="input-minimo" class="input-numero" min="1" max="999" value="1" oninput="validarDigitos(this)">
        </div>
        <div class="campo-config">
          <label for="input-maximo">Máximo:</label>
          <input type="number" id="input-maximo" class="input-numero" min="1" max="999" value="10" oninput="validarDigitos(this)">
        </div>
      </div>
      <div class="linha-botoes-modo">
        <button class="btn-modo" onclick="iniciarJogo('linear')">Linear</button>
        <button class="btn-modo" onclick="iniciarJogo('aleatorio')">Aleatório</button>
      </div>
    </div>

    <!-- TELA 2: CÉU E CONTAGEM DAS ESTRELAS -->
    <div id="campo-ceu" class="campo-ceu"></div>

    <div id="painel-resposta" class="painel-resposta">
      <input type="number" id="input-resposta" class="input-resposta" placeholder="?" oninput="validarDigitos(this)" onkeypress="tratarEnter(event)">
      <button class="btn-continuar" onclick="conferirResposta()" title="Continuar">➔</button>
    </div>

    <!-- TELA 3: CONGRATULAÇÕES -->
    <div id="painel-congratulacoes" class="painel-congratulacoes">
      <div id="mensagem-vitoria" class="mensagem-vitoria"></div>
      <button class="btn-modo" onclick="reiniciarParaEstadoInicial()">Terminar</button>
    </div>

  </div>

  <script>
    // ESTADO DO JOGO
    let modoAtual = ''; // 'linear' ou 'aleatorio'
    let valMinimo = 1;
    let valMaximo = 10;
    let sequenciaSorteio = [];
    let indiceAtual = 0;
    let quantidadeEstrelasAtual = 0;

    // LIMITA INPUTS A NO MÁXIMO 3 DÍGITOS E APENAS POSITIVOS
    function validarDigitos(input) {
      if (input.value.length > 3) {
        input.value = input.value.slice(0, 3);
      }
    }

    // INICIA O JOGO A PARTIR DO MODO ESCOLHIDO
    function iniciarJogo(modo) {
      const minInput = parseInt(document.getElementById('input-minimo').value) || 1;
      const maxInput = parseInt(document.getElementById('input-maximo').value) || 1;

      valMinimo = Math.min(minInput, maxInput);
      valMaximo = Math.max(minInput, maxInput);
      modoAtual = modo;

      // OCULTA TELA INICIAL E MOSTRA ÁREA DO JOGO
      document.getElementById('painel-configuracao').style.display = 'none';
      document.getElementById('campo-ceu').style.display = 'block';
      document.getElementById('painel-resposta').style.display = 'flex';
      document.getElementById('painel-congratulacoes').style.display = 'none';

      if (modoAtual === 'linear') {
        // MODO LINEAR: COMEÇA NO MÍNIMO E AUMENTA SEQUENCIALMENTE DE 1 EM 1
        quantidadeEstrelasAtual = valMinimo;
      } else {
        // MODO ALEATÓRIO: EMBARALHA TODOS OS VALORES ENTRE MÍNIMO E MÁXIMO
        sequenciaSorteio = [];
        for (let i = valMinimo; i <= valMaximo; i++) {
          sequenciaSorteio.push(i);
        }
        embaralharArray(sequenciaSorteio);
        indiceAtual = 0;
        quantidadeEstrelasAtual = sequenciaSorteio[indiceAtual];
      }

      // Pequeno timeout para o container calcular o tamanho final correto
      setTimeout(() => {
        exibirEstrelas(quantidadeEstrelasAtual);
      }, 50);
    }

    // EMBARALHA ARRAY (PARA O MODO ALEATÓRIO NÃO REPETIR QUANTIDADES)
    function embaralharArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // GERA AS ESTRELAS EM POSIÇÕES ALEATÓRIAS
    function exibirEstrelas(quantidade) {
      const ceu = document.getElementById('campo-ceu');
      ceu.innerHTML = '';

      const larguraCeu = ceu.clientWidth - 40;
      const alturaCeu = ceu.clientHeight - 40;

      const posicoes = [];

      for (let i = 0; i < quantidade; i++) {
        const estrela = document.createElement('div');
        estrela.className = 'estrela';
        estrela.innerHTML = '★';

        let top, left, colisao;
        let tentativas = 0;

        // TENTA POSICIONAR EVITANDO SOBREPOSIÇÃO EXCESSIVA
        do {
          colisao = false;
          top = Math.random() * (alturaCeu - 20) + 10;
          left = Math.random() * (larguraCeu - 20) + 10;

          for (let pos of posicoes) {
            const dist = Math.hypot(pos.top - top, pos.left - left);
            if (dist < 28) { // DISTÂNCIA MÍNIMA ENTRE ESTRELAS
              colisao = true;
              break;
            }
          }
          tentativas++;
        } while (colisao && tentativas < 100);

        posicoes.push({ top, left });

        estrela.style.top = top + 'px';
        estrela.style.left = left + 'px';
        ceu.appendChild(estrela);
      }
    }

    // REDIMENSIONA AS ESTRELAS CASO A JANELA MUDE DE TAMANHO
    window.onresize = function() {
      if (document.getElementById('campo-ceu').style.display === 'block') {
        exibirEstrelas(quantidadeEstrelasAtual);
      }
    };

    // CONFERE A RESPOSTA DIGITADA PELO ALUNO
    function conferirResposta() {
      const inputResp = document.getElementById('input-resposta');
      const valorDigitado = parseInt(inputResp.value);

      if (valorDigitado === quantidadeEstrelasAtual) {
        // RESPOSTA CERTA
        inputResp.classList.remove('input-erro');
        inputResp.value = '';

        avancarJogo();
      } else {
        // RESPOSTA ERRADA
        inputResp.classList.add('input-erro');
      }
    }

    // AVANÇA PARA A PRÓXIMA QUANTIDADE OU CONCLUI A ATIVIDADE
    function avancarJogo() {
      if (modoAtual === 'linear') {
        if (quantidadeEstrelasAtual < valMaximo) {
          quantidadeEstrelasAtual++;
          exibirEstrelas(quantidadeEstrelasAtual);
        } else {
          finalizarAtividade();
        }
      } else if (modoAtual === 'aleatorio') {
        indiceAtual++;
        if (indiceAtual < sequenciaSorteio.length) {
          quantidadeEstrelasAtual = sequenciaSorteio[indiceAtual];
          exibirEstrelas(quantidadeEstrelasAtual);
        } else {
          finalizarAtividade();
        }
      }
    }

    // PERMITE DAR ENTER NO CAMPO DE RESPOSTA
    function tratarEnter(event) {
      if (event.key === 'Enter') {
        conferirResposta();
      }
    }

    // MOSTRA TELA DE CONGRATULAÇÕES
    function finalizarAtividade() {
      document.getElementById('campo-ceu').style.display = 'none';
      document.getElementById('painel-resposta').style.display = 'none';

      const painelCongrat = document.getElementById('painel-congratulacoes');
      const msg = document.getElementById('mensagem-vitoria');

      msg.innerHTML = `Parabéns! Você contou com sucesso<br>todas as estrelas do <strong>${valMinimo}</strong> até o <strong>${valMaximo}</strong>!`;
      painelCongrat.style.display = 'flex';
    }

    // RETORNA A PÁGINA AO ESTADO INICIAL
    function reiniciarParaEstadoInicial() {
      document.getElementById('painel-congratulacoes').style.display = 'none';
      document.getElementById('painel-configuracao').style.display = 'flex';
      
      const inputResp = document.getElementById('input-resposta');
      inputResp.value = '';
      inputResp.classList.remove('input-erro');
    }
  </script>
</body>
</html>
