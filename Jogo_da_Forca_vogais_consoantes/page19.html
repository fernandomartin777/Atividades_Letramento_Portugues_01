<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca - Aquário (Página 2)</title>
  <style>
    * { box-sizing: border-box; font-family: Georgia, 'Times New Roman', serif; }
    body { background-color: #f0f4f8; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; font-size: 22px; }

    /* Barra Superior de Progresso e Pontuação */
    .header-progresso { width: 100%; max-width: 900px; background: #ffffff; padding: 18px 24px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
    .info-progresso { display: flex; justify-content: space-between; font-weight: bold; color: #2c3e50; font-size: 1.4rem; }
    .trilho-barra { width: 100%; height: 20px; background: #e0e6ed; border-radius: 10px; overflow: hidden; }
    .preenchimento-barra { height: 100%; background: #3498db; width: 0%; transition: width 0.4s ease; }

    /* Painel de Texto (Instruções / Dicas) */
    .painel-instrucoes { width: 100%; max-width: 900px; background: #ffffff; padding: 20px 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; color: #2c3e50; line-height: 1.5; font-size: 1.4rem; }
    .painel-instrucoes p { margin: 0 0 8px 0; }
    .painel-instrucoes p:last-child { margin-bottom: 0; }

    /* Área Principal do Jogo */
    #jogo { display: flex; width: 100%; max-width: 900px; flex-direction: column; align-items: center; gap: 25px; }

    /* Layout do Conteúdo */
    .conteudo-jogo { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 40px; width: 100%; }

    /* Tanque do Avatar */
    .tanque-container { position: relative; width: 200px; height: 200px; border: 4px solid #34495e; border-radius: 8px; overflow: hidden; background: #fff; }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
    
    .agua { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(52, 152, 219, 0.75); z-index: 2; transition: height 0.5s ease-in-out; }
    
    .onda-svg { position: absolute; top: -12px; left: 0; width: 200%; height: 14px; fill: rgba(52, 152, 219, 0.75); animation: ondaAnim 2s infinite linear; }

    @keyframes ondaAnim {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Lacunas da Palavra */
    #painel-palavra { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 600px; }
    .palavra-bloco { display: inline-flex; gap: 8px; margin-bottom: 10px; }
    .letra-box { width: 45px; height: 55px; border-bottom: 4px solid #2c3e50; display: flex; align-items: center; justify-content: center; font-size: 2.3rem; font-weight: bold; text-transform: uppercase; }

    /* Teclado Virtual */
    #teclado { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 700px; }
    .btn-letra { width: 50px; height: 50px; font-size: 1.5rem; font-weight: bold; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-letra:disabled { opacity: 0; visibility: hidden; cursor: default; }

    /* Botão Avançar */
    #btn-proximo { display: none; padding: 15px 35px; font-size: 1.5rem; font-weight: bold; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    #btn-proximo:hover { background: #27ae60; }
  </style>
</head>
<body>

  <div class="header-progresso">
    <div class="info-progresso">
      <span>Página <span id="num-pagina">2</span> de <span id="total-paginas">20</span></span>
      <span>Pontos: <span id="pontos-totais">0</span></span>
    </div>
    <div class="trilho-barra">
      <div id="preenchimento-barra" class="preenchimento-barra"></div>
    </div>
  </div>

  <div class="painel-instrucoes">
    <p><strong>Dica:</strong> Objeto</p>
  </div>

  <div id="jogo">
    <div class="conteudo-jogo">
      <div class="tanque-container">
        <img id="avatar-exibido" class="avatar-img" src="" alt="Avatar">
        <div id="nivel-agua" class="agua">
          <svg class="onda-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,0 C150,90 350,-40 500,40 C650,120 900,10 1200,40 L1200,120 L0,120 Z"></path>
          </svg>
        </div>
      </div>

      <div id="painel-palavra"></div>
    </div>

    <div id="teclado"></div>

    <button id="btn-proximo" onclick="proximaPagina()">Próxima Página</button>
  </div>

  <script>
    // ==========================================
    // CONFIGURAÇÕES DA PÁGINA E RESPOSTA
    // ==========================================
    const palavraChave = "ALMOFADA";
    const paginaAtual = 19;
    const totalPaginas = 20;
    // ==========================================

    let erros = 0;
    let acertos = 0;
    let letrasUnicasTotal = 0;
    let pontosRodada = 6;

    // Função para remover acentos para fins de comparação
    function removerAcentos(texto) {
      return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    window.onload = function() {
      document.getElementById('num-pagina').innerText = paginaAtual;
      document.getElementById('total-paginas').innerText = totalPaginas;
      
      const porcetagemBarra = (paginaAtual / totalPaginas) * 100;
      document.getElementById('preenchimento-barra').style.width = `${porcetagemBarra}%`;

      const pontosAcumulados = parseInt(localStorage.getItem('pontosAluno') || localStorage.getItem('pontuacaoTotal') || '0', 10);
      document.getElementById('pontos-totais').innerText = pontosAcumulados;

      const avatarSalvo = localStorage.getItem('avatarData');
      if (avatarSalvo) {
        document.getElementById('avatar-exibido').src = avatarSalvo;
      }

      iniciarJogo();
    };

    function iniciarJogo() {
      const painel = document.getElementById('painel-palavra');
      const teclado = document.getElementById('teclado');
      painel.innerHTML = '';
      teclado.innerHTML = '';

      const palavras = palavraChave.trim().toUpperCase().split(' ');
      
      const palavraSemAcento = removerAcentos(palavraChave.replace(/\s+/g, '').toUpperCase());
      const conjuntoLetrasUnicas = new Set(palavraSemAcento);
      letrasUnicasTotal = conjuntoLetrasUnicas.size;

      palavras.forEach(palavra => {
        const blocoPalavra = document.createElement('div');
        blocoPalavra.className = 'palavra-bloco';

        for (let letra of palavra) {
          const caixa = document.createElement('div');
          caixa.className = 'letra-box';
          caixa.dataset.letra = letra; 
          caixa.dataset.letraSemAcento = removerAcentos(letra);
          blocoPalavra.appendChild(caixa);
        }
        painel.appendChild(blocoPalavra);
      });

      const alfabeto = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      alfabeto.forEach(letra => {
        const btn = document.createElement('button');
        btn.className = 'btn-letra';
        btn.innerText = letra;
        btn.onclick = () => tentarLetra(letra, btn);
        teclado.appendChild(btn);
      });
    }

    function tentarLetra(letra, botao) {
      botao.disabled = true;
      const palavraSemAcento = removerAcentos(palavraChave.toUpperCase());

      if (palavraSemAcento.includes(letra)) {
        const caixas = document.querySelectorAll('.letra-box');
        caixas.forEach(caixa => {
          if (caixa.dataset.letraSemAcento === letra) {
            caixa.innerText = caixa.dataset.letra;
          }
        });
        
        acertos++;
        if (acertos === letrasUnicasTotal) {
          finalizarJogo(true);
        }
      } else {
        erros++;
        pontosRodada = Math.max(0, 6 - erros);
        document.getElementById('nivel-agua').style.height = `${(erros / 6) * 100}%`;

        if (erros >= 6) {
          finalizarJogo(false);
        }
      }
    }

    function finalizarJogo(venceu) {
      const botoes = document.querySelectorAll('.btn-letra');
      botoes.forEach(b => b.disabled = true);

      if (!venceu) {
        const caixas = document.querySelectorAll('.letra-box');
        caixas.forEach(caixa => caixa.innerText = caixa.dataset.letra);
      }

      const pontosAnteriores = parseInt(localStorage.getItem('pontosAluno') || localStorage.getItem('pontuacaoTotal') || '0', 10);
      const novosPontos = pontosAnteriores + pontosRodada;
      localStorage.setItem('pontosAluno', novosPontos);
      localStorage.setItem('pontuacaoTotal', novosPontos);
      document.getElementById('pontos-totais').innerText = novosPontos;

      document.getElementById('btn-proximo').style.display = 'block';
    }

    function proximaPagina() {
      // Altere o destino conforme a página atual (ex: page04.html, page05.html...)
      window.location.href = "page20.html";
    }
  </script>
</body>
</html>
