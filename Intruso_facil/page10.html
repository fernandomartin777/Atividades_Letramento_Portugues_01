<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Intruso</title>
    <style>
        /* Define a fonte com serifas e alinhamento para toda a página */
        body {
            font-family: Georgia, "Times New Roman", Liberation Serif, serif;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            color: #000000;
        }

        /* --- PAINEL DE STATUS E BARRA DE PROGRESSO --- */
        .painel-game {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .info-topo {
            display: flex;
            justify-content: space-between;
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .barra-container {
            width: 100%;
            background-color: #4a627a;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
        }

        .barra-preenchimento {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: width 0.4s ease-in-out;
        }

        /* Estilo do título em negrito */
        .titulo-pagina {
            font-size: 28pt;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Imagem centralizada e limitada a 720px */
        .imagem-pagina {
            width: 10px;
            max-width: 100%;
            height: auto;
            margin-bottom: 30px;
            border-radius: 6px;
        }

        /* Estilo dos parágrafos de texto */
        .texto-paragrafo {
            font-size: 22pt;
            line-height: 1.4;
            text-align: left;
            text-indent: 1.5cm;
            margin-bottom: 20px;
        }

        /* Área de interação (Input e Botões) */
        .area-resposta {
            margin-top: 30px;
            text-align: center;
        }

        .campo-input {
            width: 80%;
            max-width: 600px;
            font-size: 20pt;
            font-family: Georgia, "Times New Roman", Liberation Serif, serif;
            padding: 10px 15px;
            border: 2px solid #333;
            border-radius: 6px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .btn-conferir {
            font-size: 20pt;
            font-family: Georgia, "Times New Roman", Liberation Serif, serif;
            font-weight: bold;
            background-color: #008CBA;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-proxima {
            display: inline-block;
            font-size: 20pt;
            font-family: Georgia, "Times New Roman", Liberation Serif, serif;
            font-weight: bold;
            color: white;
            background-color: #28a745;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
        }

        .escondido {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 1. PAINEL DE STATUS E BARRA DE PROGRESSO DINÂMICA -->
    <div class="painel-game">
        <div class="info-topo">
            <span>Página <span id="lblPagina">1/10</span></span>
            <span>Pontos: <span id="lblPontos">0</span></span>
        </div>
        <div class="barra-container">
            <div class="barra-preenchimento" id="barraProgresso"></div>
        </div>
    </div>

    <!-- 2. TÍTULO DA PÁGINA -->
    <h1 class="titulo-pagina">Onde está o intruso?</h1>

    <!-- 3. IMAGEM -->
    <img src="blank.jpg" class="imagem-pagina" alt="   ">

    <!-- 4. TEXTOS DA ATIVIDADE -->
    <p class="texto-paragrafo">UVA</p>
    <p class="texto-paragrafo">BANANA</p>
    <p class="texto-paragrafo">PATO</p>
    <p class="texto-paragrafo">ABACAXI</p>

    <!-- 5. ÁREA DE RESPOSTA E BOTÕES -->
    <div class="area-resposta">
        <div>
            <input type="text" id="inputResposta" class="campo-input" maxlength="100" placeholder="Digite sua resposta aqui...">
        </div>

        <div>
            <button class="btn-conferir" id="btnConferir" onclick="conferirResposta()">Conferir</button>
        </div>

        <div>
            <a id="btnProxima" class="btn-proxima escondido" onclick="irParaProximaPagina()">Próxima Página &gt;</a>
        </div>
    </div>

    <script>
        // ===================================================
        // CONFIGURAÇÕES DA PÁGINA (Ajuste por arquivo HTML)
        // ===================================================
        const paginaAtual = 10;
        const totalPaginas = 10;
        const proximaPaginaURL = "page11.html";
        const respostaCorreta = "PATO";

        // Controle de Tentativas da página atual
        let tentativas = 0;
        let acertou = false;

        // ===================================================
        // LER PONTUAÇÃO DO LOCALSTORAGE (Navegador)
        // ===================================================
        // Lê do localStorage ou começa em 0 se não houver registro
        let pontosAtuais = parseInt(localStorage.getItem("pontosAluno")) || 0;

        // Atualizar painel do topo na inicialização
        document.getElementById("lblPagina").innerText = `${paginaAtual}/${totalPaginas}`;
        document.getElementById("lblPontos").innerText = pontosAtuais;
        document.getElementById("barraProgresso").style.width = `${(paginaAtual / totalPaginas) * 100}%`;

        // ===================================================
        // LÓGICA DE VALIDAÇÃO E PONTUAÇÃO
        // ===================================================
        function conferirResposta() {
            if (acertou) return;

            const inputElemento = document.getElementById("inputResposta");
            const respostaDigitada = inputElemento.value.trim();

            if (respostaDigitada.toLowerCase() === respostaCorreta.toLowerCase()) {
                acertou = true;
                let pontosGanhos = 0;

                // Cálculo regressivo de pontos
                if (tentativas === 0) pontosGanhos = 3;
                else if (tentativas === 1) pontosGanhos = 2;
                else if (tentativas === 2) pontosGanhos = 1;
                else pontosGanhos = 0;

                pontosAtuais += pontosGanhos;

                // Salva a nova pontuação acumulada na memória fixa do navegador
                localStorage.setItem("pontosAluno", pontosAtuais);

                // Atualiza o painel visual
                document.getElementById("lblPontos").innerText = pontosAtuais;

                alert(`🎉 Parabéns! Você acertou e ganhou +${pontosGanhos}!`);
                
                // Exibe o botão de próxima página e desabilita conferência repetida
                document.getElementById("btnProxima").classList.remove("escondido");
                document.getElementById("btnConferir").disabled = true;
                document.getElementById("btnConferir").style.opacity = "0.5";
            } else {
                tentativas++;
                alert(`❌ Resposta incorreta. (Tentativa ${tentativas}) Tente novamente!`);
            }
        }

        // ===================================================
        // NAVEGAÇÃO
        // ===================================================
        function irParaProximaPagina() {
            window.location.href = proximaPaginaURL;
        }
    </script>

</body>
</html>
