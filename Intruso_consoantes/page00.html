<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da forca com vogais+consoantes</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Georgia, 'Times New Roman', serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container-inicio {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 600px;
      width: 100%;
      text-align: center;
      border: 2px solid #2c3e50;
    }

    h1 {
      font-size: 22px;
      color: #2c3e50;
      margin: 0 0 20px 0;
    }

    p {
      font-size: 16px;
      color: #34495e;
      line-height: 1.6;
      margin: 0 0 25px 0;
    }

    .btn-iniciar {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background-color: #27ae60;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-iniciar:hover {
      background-color: #219150;
    }
  </style>
</head>
<body>

  <div class="container-inicio">
    <h1>Quem é o intruso?</h1>
    
    <p>Leia as palavras e escreva qual delas não deveria estar no grupo.</p>

    <button class="btn-iniciar" onclick="iniciarAtividade()">Iniciar atividade</button>
  </div>

  <script>
    function iniciarAtividade() {
      // Zera a pontuação no LocalStorage
      localStorage.setItem("pontosAluno", 0);
      localStorage.setItem("pontuacaoTotal", 0);

      // Redireciona para a primeira página da atividade
      window.location.href = "page01.html";
    }
  </script>

</body>
</html>
