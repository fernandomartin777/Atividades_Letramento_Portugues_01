<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>História</title>
    <style>
        /* Define a fonte com serifas e alinhamento para toda a página */
        body {
            font-family: Georgia, "Times New Roman", Liberation Serif, serif;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            color: #000000;
        }

        /* --- PAINEL DE STATUS E BARRA DE PROGRESSO --- */
        .painel-game {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .info-topo {
            display: flex;
            justify-content: space-between;
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .barra-container {
            width: 100%;
            background-color: #4a627a;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
        }

        .barra-preenchimento {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: width 0.4s ease-in-out;
        }

        /* Estilo do título em negrito */
        .titulo-pagina {
            font-size: 28pt;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Imagem centralizada e limitada a 720px */
        .imagem-pagina {
            width: 720px;
            max-width: 100%;
            height: auto;
            margin-bottom: 30px;
            border-radius: 6px;
        }

        /* Estilo dos parágrafos de texto */
        .texto-paragrafo {
            font-size: 22pt;
            line-height: 1.4;
            text-align: left;
            text-indent: 1.5cm;
            margin-bottom: 20px;
        }

        /* Container e estilo do botão de continuar */
        .area-botao {
            margin-top: 40px;
            text-align: center;
        }

        .btn-continuar {
            display: inline-block;
            font-size: 22pt;
            font-weight: bold;
            color: #000080;
            text-decoration: none;
            border: 2px solid #000080;
            padding: 10px 24px;
            border-radius: 6px;
            background-color: #f0f0f0;
            transition: background-color 0.2s;
        }

        .btn-continuar:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <!-- 1. PAINEL DE STATUS E BARRA DE PROGRESSO -->
    <div class="painel-game">
        <div class="info-topo">
            <span>Página <span id="lblPagina">1/10</span></span>
            <span>Pontos: <span id="lblPontos">0</span></span>
        </div>
        <div class="barra-container">
            <div class="barra-preenchimento" id="barraProgresso"></div>
        </div>
    </div>

    <!-- 2. TÍTULO DA PÁGINA (NEGRITO) -->
    <h1 class="titulo-pagina">Você terminou!</h1>

    <!-- 3. CAMINHO DA IMAGEM (TAMANHO MAX 720px) -->
    <img src="blank.jpg" class="imagem-pagina" alt="Imagem da página">

    <!-- 4. PARÁGRAFOS DE TEXTO (EDITAR AQUI) -->
    <p class="texto-paragrafo"> </p>
    <p class="texto-paragrafo"> </p>
    <p class="texto-paragrafo"> </p>

    <!-- 5. BOTÃO PARA A PRÓXIMA PÁGINA -->
    <div class="area-botao">
        <a href="https://fernandomartin777.github.io/Atividades_Letramento_Portugues_01/" class="btn-continuar">Fim &gt;</a>
    </div>

    <script>
        // ===================================================
        // CONFIGURAÇÕES DA PÁGINA (Ajuste por arquivo HTML)
        // ===================================================
        const paginaAtual = 10;     // Número desta página
        const totalPaginas = 10;   // Total de páginas do capítulo/atividade

        // ===================================================
        // CARREGAR DADOS DO NAVEGADOR
        // ===================================================
        const pontosAtuais = parseInt(localStorage.getItem("pontosAluno")) || 0;

        // Atualiza os dados do painel no topo
        document.getElementById("lblPagina").innerText = `${paginaAtual}/${totalPaginas}`;
        document.getElementById("lblPontos").innerText = pontosAtuais;
        document.getElementById("barraProgresso").style.width = `${(paginaAtual / totalPaginas) * 100}%`;
    </script>

</body>
</html>
