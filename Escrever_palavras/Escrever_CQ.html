<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escrita de nomes de imagens</title>
  <style>
    /* RESET E TIPOGRAFIA DE SERIFAS */
    * {
      box-sizing: border-box;
      font-family: Georgia, 'Times New Roman', serif;
      color: #000000;
    }

    html {
      font-size: 20px;
    }

    @media (max-width: 600px) {
      html {
        font-size: 17px;
      }
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
    }

    .container-principal {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      border: 2px solid #2980b9;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 12px rgba(41, 128, 185, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BARRA DE PROGRESSO EM TONS DE AZUL */
    .header-progresso {
      width: 100%;
      margin-bottom: 20px;
    }

    .trilho-barra {
      width: 100%;
      height: 24px;
      background-color: #ebf5fb;
      border: 2px solid #3498db;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .preenchimento-barra {
      height: 100%;
      background-color: #2980b9;
      width: 0%;
      transition: width 0.4s ease-in-out;
    }

    .info-pontos {
      display: flex;
      justify-content: flex-end;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 6px;
      color: #1a5276;
    }

    /* CONTADOR DE QUESTÕES E TÍTULO */
    .contador-questoes {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2980b9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 5px;
      text-align: center;
    }

    .titulo-questao {
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      font-weight: bold;
      text-align: center;
      margin: 5px 0 15px 0;
    }

    /* IMAGEM DA QUESTÃO */
    .container-imagem {
      margin: 10px 0 20px 0;
      text-align: center;
    }

    .imagem-exibida {
      max-width: 100%;
      max-height: 280px;
      width: auto;
      height: auto;
      border-radius: 8px;
      border: 2px solid #aeb6bf;
      object-fit: contain;
    }

    /* ÁREA DE TEXTOS / PARÁGRAFOS */
    .painel-paragrafos {
      width: 100%;
      margin-bottom: 20px;
      text-align: left;
    }

    .painel-paragrafos p {
      font-size: clamp(1.3rem, 3.8vw, 1.6rem);
      line-height: 1.6;
      margin: 0 0 12px 0;
    }

    /* ÁREA LIVRE PARA O CACHORRO E O AVATAR (Sem retângulo em volta) */
    .pista-livre-container {
      width: 100%;
      height: 120px;
      position: relative;
      margin: 10px 0;
    }

    .entidade-pista {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      transition: left 0.4s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      margin: 0;
    }

/* AJUSTE DO CACHORRO (Movido para baixo) */
    #dog-box {
      left: -10%;
      top: 70%;         /* Aumentar a porcentagem move para baixo (ex: 55%, 60%) */
      z-index: 2;
      width: 110px;
      height: 110px;
    }

    /* AJUSTE DO AVATAR (Movido para cima) */
    #avatar-box {
      right: -110px;
      top: 0%;         /* Diminuir a porcentagem move para cima (ex: 45%, 40%) */
      z-index: 1;
      width: 300px;
      height: 300px;
    }

    .entidade-pista img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      border: none;
    }

    /* TRILHA DE PRÊMIOS ORIGINAL (Borda tracejada) */
    .trilha-premios-container {
      width: 100%;
      min-height: 36px;
      background-color: #f7f9fa;
      border: 1.5px dashed #2980b9;
      border-radius: 8px;
      padding: 4px 8px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .img-premio {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    /* QUADRADOS DE RESPOSTA */
    .container-quadrados {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 8px;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .palavra-grupo {
      display: inline-flex;
      gap: 8px;
      white-space: nowrap;
    }

    .quadrado-letra {
      width: clamp(38px, 8vw, 48px);
      height: clamp(48px, 9vw, 58px);
      border: 2px solid #2c3e50;
      border-radius: 6px;
      text-align: center;
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      font-weight: bold;
      text-transform: none;
      outline: none;
    }

    .quadrado-letra.brancoi {
      background-color: #ffffff;
    }

    .quadrado-espaco {
      background-color: #bdc3c7 !important;
      border-color: #95a5a6;
      cursor: default;
      margin: 0 4px;
    }

    .quadrado-correto {
      background-color: #d4efdf !important;
      border-color: #27ae60;
    }

    .quadrado-incorreto {
      background-color: #fadbd8 !important;
      border-color: #e74c3c;
    }

    /* BOTÕES EMPILHADOS VERTICALMENTE */
    .area-botoes {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      margin-top: 10px;
    }

    .btn-acao {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff !important;
      background-color: #2980b9;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-acao:hover:not(:disabled) {
      background-color: #1f618d;
    }

    .btn-acao:disabled {
      background-color: #bdc3c7 !important;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-proximo {
      background-color: #27ae60;
      display: none;
    }

    .btn-proximo:hover {
      background-color: #1e8449;
    }
  </style>
</head>
<body>

  <div class="container-principal">
    <!-- BARRA DE PROGRESSO & PONTOS -->
    <div class="header-progresso">
      <div class="trilho-barra">
        <div id="barra-preenchimento" class="preenchimento-barra"></div>
      </div>
      <div class="info-pontos">
        PONTOS: <span id="pontos-atuais">0</span> / <span id="pontos-maximos">100</span>
      </div>
    </div>

    <!-- NUMERAÇÃO E TÍTULO DA QUESTÃO -->
    <div id="contador-questoes" class="contador-questoes">Questão 1 de 10</div>
    <div id="titulo-questao" class="titulo-questao">Escreva o nome das palavras</div>

    <!-- IMAGEM DA QUESTÃO -->
    <div class="container-imagem">
      <img id="imagem-questao" class="imagem-exibida" src="imagem01.jpg" alt="Imagem da questão">
    </div>

    <!-- PARÁGRAFOS DEDICADOS -->
    <div id="painel-paragrafos" class="painel-paragrafos"></div>

    <!-- ÁREA LIVRE COM O CACHORRO E O AVATAR (Sem retângulo em volta) -->
    <div class="pista-livre-container">
      <div id="dog-box" class="entidade-pista">
        <img id="img-dog" src="dog1.png" alt="Cachorro">
      </div>
      <div id="avatar-box" class="entidade-pista">
        <img id="img-avatar" src="" alt="Avatar">
      </div>
    </div>

    <!-- TRILHA DE PRÊMIOS ORIGINAL (Com prize.png) -->
    <div id="trilha-premios" class="trilha-premios-container"></div>

    <!-- QUADRADOS DE RESPOSTA -->
    <div id="container-quadrados" class="container-quadrados"></div>

    <!-- BOTÕES DE AÇÃO EMPILHADOS -->
    <div class="area-botoes">
      <button id="btn-conferir" class="btn-acao" onclick="conferirResposta()">Conferir a resposta</button>
      <button id="btn-proximo" class="btn-acao btn-proximo" onclick="avancarQuestao()">Próxima questão</button>
    </div>
  </div>

  <script>
    const questoes = [
      {
        resposta: "caneta",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/caneta.png",
        paragrafos: [" "]
      },
      {
        resposta: "faca",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/faca.png",
        paragrafos: [" "]
      },
      {
        resposta: "caqui",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/caqui.png",
        paragrafos: [" "]
      },      
      {
        resposta: "raquete",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/raquete.png",
        paragrafos: [" "]
      },
      {
        resposta: "queijo",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/queijo.png",
        paragrafos: [" "]
      },
      {
        resposta: "coqueiro",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/coqueiro.png",
        paragrafos: [" "]
      },
      {
        resposta: "periquito",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/periquito.png",
        paragrafos: [" "]
      },
      {
        resposta: "esquilo",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/esquilo.png",
        paragrafos: [" "]
      },
      {
        resposta: "coco",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/coco.png",
        paragrafos: [" "]
      },
      {
        resposta: "copo",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/copo-vazio.png",
        paragrafos: [" "]
      },
      {
        resposta: "buraco",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/buraco.png",
        paragrafos: [" "]
      },
      {
        resposta: "cubo",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/cubo.png",
        paragrafos: [" "]
      },            
      {
        resposta: "jacu",
        sensivelCase: false,
        titulo: "Escreva o nome das palavras.",
        imagem: "../Atividades_com_imagens/jacu.png",
        paragrafos: [" "]
      }
    ];

    let indiceAtual = 0;
    let pontuacaoAcumulada = 0;
    let tentativasQuestao = 0;
    let passosDog = 0;
    const maxPassos = 6;

    window.onload = function() {
      const avatarSalvo = localStorage.getItem('avatarData');
      if (avatarSalvo) {
        document.getElementById('img-avatar').src = avatarSalvo;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const qParam = urlParams.get('q');
      const pParam = urlParams.get('p');

      if (qParam !== null && !isNaN(qParam)) {
        let questaoInformada = parseInt(qParam, 10) - 1;
        indiceAtual = Math.max(0, Math.min(questoes.length - 1, questaoInformada));
      }

      if (pParam !== null && !isNaN(pParam)) {
        pontuacaoAcumulada = parseInt(pParam, 10);
      } else {
        pontuacaoAcumulada = parseInt(localStorage.getItem('pontosAluno') || '0', 10);
      }

      localStorage.setItem('pontosAluno', pontuacaoAcumulada);
      localStorage.setItem('pontuacaoTotal', pontuacaoAcumulada);

      document.getElementById('pontos-maximos').innerText = questoes.length * 5;
      carregarQuestao(indiceAtual);
      atualizarInterface();
    };

    function carregarQuestao(index) {
      tentativasQuestao = 0;
      passosDog = 0;

      const btnConferir = document.getElementById('btn-conferir');
      btnConferir.style.display = 'block';
      btnConferir.disabled = false;

      document.getElementById('btn-proximo').style.display = 'none';

      const q = questoes[index];

      document.getElementById('contador-questoes').innerText = `Questão ${index + 1} de ${questoes.length}`;
      document.getElementById('titulo-questao').innerText = q.titulo;
      document.getElementById('imagem-questao').src = q.imagem;

      const painelParaf = document.getElementById('painel-paragrafos');
      painelParaf.innerHTML = '';
      q.paragrafos.forEach(pTexto => {
        const p = document.createElement('p');
        p.innerText = pTexto;
        painelParaf.appendChild(p);
      });

      gerarQuadradosResposta(q.resposta);
      atualizarInterface();
    }

    function gerarQuadradosResposta(resposta) {
      const container = document.getElementById('container-quadrados');
      container.innerHTML = '';

      const palavras = resposta.split(' ');

      palavras.forEach((palavra, indexPalavra) => {
        const palavraGroup = document.createElement('span');
        palavraGroup.className = 'palavra-grupo';

        for (let i = 0; i < palavra.length; i++) {
          const input = criarInputLetra();
          palavraGroup.appendChild(input);
        }

        container.appendChild(palavraGroup);

        if (indexPalavra < palavras.length - 1) {
          const inputEspaco = document.createElement('input');
          inputEspaco.type = 'text';
          inputEspaco.value = ' ';
          inputEspaco.readOnly = true;
          inputEspaco.className = 'quadrado-letra quadrado-espaco';
          container.appendChild(inputEspaco);
        }
      });

      configurarNavegacaoInputs();
    }

    function criarInputLetra() {
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 2;
      input.autocomplete = 'off';
      input.autocorrect = 'off';
      input.autocapitalize = 'off';
      input.spellcheck = false;
      input.className = 'quadrado-letra brancoi';
      return input;
    }

    function configurarNavegacaoInputs() {
      const inputs = Array.from(document.querySelectorAll('.quadrado-letra'));

      inputs.forEach((input, index) => {
        if (input.readOnly) return;

        let emComposicao = false;

        input.addEventListener('beforeinput', function(e) {
          if (e.data === ' ') {
            e.preventDefault();
          }
        });

        input.addEventListener('keydown', function(e) {
          if (e.key === ' ' || e.keyCode === 32) {
            e.preventDefault();
            return false;
          }

          if (e.key === 'Backspace' && input.value === '') {
            for (let j = index - 1; j >= 0; j--) {
              if (!inputs[j].readOnly) {
                inputs[j].focus();
                break;
              }
            }
          }
        });

        input.addEventListener('compositionstart', function() {
          emComposicao = true;
        });

        input.addEventListener('compositionend', function() {
          emComposicao = false;
          processarAvanco(input, inputs, index);
        });

        input.addEventListener('input', function() {
          input.classList.remove('quadrado-correto', 'quadrado-incorreto');
          if (!emComposicao) {
            processarAvanco(input, inputs, index);
          }
        });
      });
    }

    function processarAvanco(input, inputs, index) {
      if (input.value.includes(' ')) {
        input.value = input.value.replace(/\s/g, '');
      }

      if (Array.from(input.value).length > 1) {
        const caracters = Array.from(input.value);
        input.value = caracters[caracters.length - 1];
      }

      if (Array.from(input.value).length === 1) {
        for (let j = index + 1; j < inputs.length; j++) {
          if (!inputs[j].readOnly) {
            inputs[j].focus();
            break;
          }
        }
      }
    }

    function conferirResposta() {
      const q = questoes[indiceAtual];
      const inputs = document.querySelectorAll('.quadrado-letra');
      let acertosCompletos = true;

      tentativasQuestao++;

      for (let i = 0; i < q.resposta.length; i++) {
        const esperado = q.resposta[i];
        const digitado = inputs[i].value;

        let ehCorreto = false;

        if (esperado === ' ') {
          ehCorreto = true;
        } else if (q.sensivelCase) {
          ehCorreto = (digitado === esperado);
        } else {
          ehCorreto = (digitado.toLowerCase() === esperado.toLowerCase());
        }

        if (ehCorreto) {
          inputs[i].classList.remove('quadrado-incorreto');
          inputs[i].classList.add('quadrado-correto');
        } else {
          inputs[i].classList.remove('quadrado-correto');
          inputs[i].classList.add('quadrado-incorreto');
          acertosCompletos = false;
        }
      }

      if (acertosCompletos) {
        let pontosGanhos = Math.max(0, 6 - tentativasQuestao);
        pontuacaoAcumulada += pontosGanhos;
        localStorage.setItem('pontosAluno', pontuacaoAcumulada);
        localStorage.setItem('pontuacaoTotal', pontuacaoAcumulada);

        document.getElementById('btn-conferir').disabled = true;

        const btnProximo = document.getElementById('btn-proximo');
        if (indiceAtual === questoes.length - 1) {
          btnProximo.innerText = "Terminar atividade";
        } else {
          btnProximo.innerText = "Próxima questão";
        }
        btnProximo.style.display = 'block';

      } else {
        passosDog = Math.min(maxPassos, passosDog + 1);

        // Se o cachorro alcançar o avatar, penaliza os pontos mas NÃO libera o botão de avançar
        if (passosDog >= maxPassos) {
          pontuacaoAcumulada = Math.max(0, pontuacaoAcumulada - 4);
          localStorage.setItem('pontosAluno', pontuacaoAcumulada);
          localStorage.setItem('pontuacaoTotal', pontuacaoAcumulada);
        }
      }

      atualizarInterface();
    }

    function atualizarInterface() {
      const percentualBarra = ((indiceAtual + 1) / questoes.length) * 100;
      document.getElementById('barra-preenchimento').style.width = `${percentualBarra}%`;
      document.getElementById('pontos-atuais').innerText = pontuacaoAcumulada;

      // Trilha de Prêmios original (prize.png) abaixo dos personagens
      const containerPremios = document.getElementById('trilha-premios');
      containerPremios.innerHTML = '';
      for (let i = 0; i < pontuacaoAcumulada; i++) {
        const img = document.createElement('img');
        img.src = 'prize.png';
        img.className = 'img-premio';
        img.alt = 'Prêmio';
        containerPremios.appendChild(img);
      }

      const porcentagemAproximacao = (passosDog / maxPassos) * 82;
      const dogBox = document.getElementById('dog-box');
      dogBox.style.left = `${porcentagemAproximacao}%`;

      const imgDog = document.getElementById('img-dog');
      // Troca para dog2.png no penúltimo e último passo
      if (passosDog >= maxPassos - 1) {
        imgDog.src = "dog2.png";
      } else {
        imgDog.src = "dog1.png";
      }

      if (passosDog >= maxPassos) {
        dogBox.style.zIndex = "3";
      } else {
        dogBox.style.zIndex = "2";
      }
    }

    function avancarQuestao() {
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (indiceAtual < questoes.length - 1) {
        indiceAtual++;
        carregarQuestao(indiceAtual);
      } else {
        window.location.href = "end.html";
      }
    }
  </script>

</body>
</html>
