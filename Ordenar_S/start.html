<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da forca com vogais+consoantes</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Georgia, 'Times New Roman', serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container-inicio {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 600px;
      width: 100%;
      text-align: center;
      border: 2px solid #2c3e50;
    }

    h1 {
      font-size: 22px;
      color: #2c3e50;
      margin: 0 0 20px 0;
    }

    p {
      font-size: 16px;
      color: #34495e;
      line-height: 1.6;
      margin: 0 0 25px 0;
    }

    /* Estilos do Seletor e Pré-visualização do Avatar */
    .area-avatar {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .btn-procurar {
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    .btn-procurar:hover {
      background-color: #2980b9;
    }

    .avatar-preview {
      width: 120px;
      height: 120px;
      border: 3px solid #34495e;
      border-radius: 8px;
      object-fit: cover;
      display: none;
      background-color: #fff;
    }

    .btn-iniciar {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background-color: #27ae60;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-iniciar:hover:not(:disabled) {
      background-color: #219150;
    }

    .btn-iniciar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container-inicio">
    <h1>Jogo da forca com vogais+consoantes</h1>
    
    <p>Escolha uma foto sua e depois tente descobrir a palavra secreta antes que a água suba.</p>

    <!-- Área de Escolha e Exibição do Avatar -->
    <div class="area-avatar">
      <input type="file" id="input-avatar" accept="image/*" style="display: none;" onchange="carregarAvatar(event)">
      <button class="btn-procurar" onclick="document.getElementById('input-avatar').click()">Procurar foto</button>
      <img id="avatar-preview" class="avatar-preview" alt="Pré-visualização do Avatar">
    </div>

    <!-- Botão Iniciar Atividade (Inicia desabilitado até selecionar a foto) -->
    <button id="btn-iniciar" class="btn-iniciar" onclick="iniciarAtividade()" disabled>Iniciar atividade</button>
  </div>

  <script>
    function carregarAvatar(event) {
      const arquivo = event.target.files[0];
      if (arquivo) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Image = e.target.result;
          
          // Armazena a imagem no LocalStorage para ser usada pelas páginas do jogo
          localStorage.setItem('avatarData', base64Image);
          
          // Exibe a pré-visualização da imagem na tela
          const imgPreview = document.getElementById('avatar-preview');
          imgPreview.src = base64Image;
          imgPreview.style.display = 'block';

          // Habilita o botão para iniciar
          document.getElementById('btn-iniciar').disabled = false;
        };
        reader.readAsDataURL(arquivo);
      }
    }

    function iniciarAtividade() {
      // Zera a pontuação no LocalStorage
      localStorage.setItem("pontosAluno", 0);
      localStorage.setItem("pontuacaoTotal", 0);

      // Redireciona para a primeira página da atividade
      window.location.href = "jogo.html";
    }
  </script>

</body>
</html>
