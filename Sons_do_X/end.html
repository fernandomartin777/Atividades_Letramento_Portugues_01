<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parabéns!</title>
  <style>
    /* RESET E TIPOGRAFIA DE SERIFAS */
    * {
      box-sizing: border-box;
      font-family: Georgia, 'Times New Roman', serif;
      color: #000000;
    }

    html {
      font-size: 18px;
    }

    @media (max-width: 600px) {
      html {
        font-size: 16px;
      }
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
    }

    .container-principal {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      border: 2px solid #2980b9;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 12px rgba(41, 128, 185, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BARRA DE PROGRESSO EM TONS DE AZUL */
    .header-progresso {
      width: 100%;
      margin-bottom: 20px;
    }

    .trilho-barra {
      width: 100%;
      height: 24px;
      background-color: #ebf5fb;
      border: 2px solid #3498db;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .preenchimento-barra {
      height: 100%;
      background-color: #2980b9;
      width: 100%; /* Concluído */
      transition: width 0.4s ease-in-out;
    }

    .info-pontos {
      display: flex;
      justify-content: flex-end;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 6px;
      color: #1a5276;
    }

    /* TÍTULO DE CONGRATULAÇÕES */
    .titulo-congratulacoes {
      font-size: clamp(1.6rem, 4.5vw, 2.2rem);
      font-weight: bold;
      text-align: center;
      color: #27ae60;
      margin: 15px 0 20px 0;
    }

    /* IMAGEM DE VITÓRIA (MAIOR QUE O PADRÃO) */
    .container-imagem-vitoria {
      margin: 10px 0 25px 0;
      text-align: center;
      width: 100%;
    }

    .imagem-vitoria {
      max-width: 100%;
      max-height: 400px; /* Destaque maior */
      width: auto;
      height: auto;
      border-radius: 10px;
      border: 3px solid #27ae60;
      object-fit: contain;
    }

    /* ÁREA DO BOTÃO FIM */
    .area-botoes {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .btn-fim {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff !important;
      background-color: #27ae60;
      border: none;
      padding: 14px 40px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
      display: inline-block;
      text-align: center;
    }

    .btn-fim:hover {
      background-color: #1e8449;
    }
  </style>
</head>
<body>

  <div class="container-principal">
    <!-- BARRA DE PROGRESSO & PONTOS -->
    <div class="header-progresso">
      <div class="trilho-barra">
        <div id="barra-preenchimento" class="preenchimento-barra"></div>
      </div>
      <div class="info-pontos">
        PONTOS: <span id="pontos-atuais">0</span> / <span id="pontos-maximos">100</span>
      </div>
    </div>

    <!-- MENSAGEM DE CONGRATULAÇÕES -->
    <div class="titulo-congratulacoes">
      🎉 Parabéns! Você concluiu todas as atividades com sucesso! 🎉
    </div>

    <!-- IMAGEM DE VITÓRIA -->
    <div class="container-imagem-vitoria">
      <img src="victory.png" alt="Vitória" class="imagem-vitoria">
    </div>

    <!-- BOTÃO FIM -->
    <div class="area-botoes">
      <a href="https://fernandomartin777.github.io/Atividades_Letramento_Portugues_01/" class="btn-fim">Fim</a>
    </div>
  </div>

  <script>
    window.onload = function() {
      // Recupera os pontos totais salvos durante a sessão
      const pontuacaoFinal = localStorage.getItem('pontosAluno') || localStorage.getItem('pontosTotais') || '0';
      
      document.getElementById('pontos-atuais').innerText = pontuacaoFinal;
      
      // Caso precise ajustar o valor máximo dinamicamente (padrão 100 XP para 20 questões)
      document.getElementById('pontos-maximos').innerText = "100";
    };
  </script>

</body>
</html>
